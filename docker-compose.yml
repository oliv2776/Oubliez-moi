services:
  oubliez-moi:
    build: .
    # Ou, pour utiliser l'image publiée par GitHub Actions au lieu de la construire :
    # image: ghcr.io/oliv2776/oubliez-moi:latest
    container_name: oubliez-moi
    restart: unless-stopped
    env_file: .env
    # Permet de joindre un service installé directement sur le serveur (Ollama par exemple)
    # à l'adresse http://host.docker.internal:11434.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Par défaut, accessible uniquement depuis le serveur (127.0.0.1).
      # Pour y accéder depuis votre réseau local, mettez BIND_ADDRESS=0.0.0.0 dans .env.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-27480}:27480"
    volumes:
      - oubliez-moi-data:/data
      # Sauvegardes : indiquez dans .env un dossier de votre pool (BACKUP_PATH=/mnt/tank/backups/oubliez-moi),
      # accessible en écriture à l'utilisateur du conteneur : sudo chown 10001 /mnt/tank/backups/oubliez-moi
      - ${BACKUP_PATH:-./backups}:/backups

  # IA locale facultative, pour classer les réponses ambiguës.
  # Démarrage : docker compose --profile ia up -d
  # Puis, dans Réglages → Automatismes : adresse http://ollama:11434, choisir le modèle
  # (tev1:4b recommandé) et cliquer sur « Télécharger ce modèle ».
  ollama:
    image: ollama/ollama
    container_name: ollama
    profiles: ["ia"]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "5m"          # modèle déchargé de la RAM après 5 min sans usage
      OLLAMA_NUM_PARALLEL: "1"         # une seule analyse à la fois
      OLLAMA_MAX_LOADED_MODELS: "1"
    # Garde-fous pour ne pas ralentir les autres conteneurs du serveur :
    cpus: "4"                          # au plus 4 cœurs
    cpu_shares: 256                    # priorité basse quand le processeur est disputé
    mem_limit: 8g
    volumes:
      - ollama-data:/root/.ollama

volumes:
  oubliez-moi-data:
  ollama-data:
